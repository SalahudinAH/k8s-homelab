apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: status-api
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/SalahudinAH/k8s-homelab.git
    targetRevision: main
    path: apps/status-api
  destination:
    server: https://kubernetes.default.svc
    namespace: status-api
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
