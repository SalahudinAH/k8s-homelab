name: Build status-api

on:
  push:
    branches: [main]
    paths:
      - 'src/status-api/**'
      - '.github/workflows/build-status-api.yml'

permissions:
  contents: write
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: src/status-api
          push: true
          tags: |
            ghcr.io/salahudinah/status-api:${{ github.sha }}
            ghcr.io/salahudinah/status-api:latest
