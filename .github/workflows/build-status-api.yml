name: Build status-api

on:
  push:
    branches: [main]
    paths:
      - 'src/status-api/**'
      - '.github/workflows/build-status-api.yml'

permissions:
  contents: write
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: src/status-api
          push: true
          build-args: |
            APP_VERSION=${{ github.sha }}
          tags: |
            ghcr.io/salahudinah/status-api:${{ github.sha }}
            ghcr.io/salahudinah/status-api:latest

      - name: Update image tag in manifest
        run: |
          sed -i "s|image: ghcr.io/salahudinah/status-api:.*|image: ghcr.io/salahudinah/status-api:${{ github.sha }}|" apps/status-api/deployment.yaml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/status-api/deployment.yaml
          git commit -m "Deploy status-api ${{ github.sha }}"
          git push
